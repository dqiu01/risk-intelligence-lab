name: Risk Intelligence Lab CI

on:
  push:
  pull_request:

concurrency:
  group: risk-intelligence-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engines:
    name: engine / ${{ matrix.engine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine:
          - engines/01-risk-exposure-loss-distribution
          - engines/02-liquidity-cashflow-risk
          - engines/03-market-portfolio-risk
          - engines/04-credit-counterparty-risk
          - engines/05-monte-carlo-scenario-engine
          - engines/06-stress-reverse-stress
          - engines/07-risk-constrained-optimization
          - engines/08-integrated-risk-dependency
    defaults:
      run:
        working-directory: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install engine dependencies
        run: pip install -r requirements.txt
      - name: Run engine tests
        run: pytest
      - name: Run engine validation
        run: python validation/validate_model.py

  integrated-interface:
    name: integrated interactive interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install lab dependencies
        run: pip install -r requirements.txt
      - name: Run integrated interface tests
        run: pytest
      - name: Build unified application
        run: python -c "import app; assert app.build_app() is not None"
