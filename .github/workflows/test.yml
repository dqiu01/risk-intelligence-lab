name: Risk Intelligence Lab CI

on:
  push:
  pull_request:

concurrency:
  group: risk-intelligence-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engines:
    name: engine / ${{ matrix.engine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine:
          - engines/01-risk-exposure-loss-distribution
          - engines/02-liquidity-cashflow-risk
          - engines/03-market-portfolio-risk
          - engines/04-credit-counterparty-risk
          - engines/05-monte-carlo-scenario-engine
          - engines/06-stress-reverse-stress
          - engines/07-risk-constrained-optimization
          - engines/08-integrated-risk-dependency
    defaults:
      run:
        working-directory: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install engine dependencies
        run: pip install -r requirements.txt
      - name: Run engine tests
        run: pytest
      - name: Run engine validation
        run: python validation/validate_model.py

  browser-interface:
    name: browser interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check browser source
        run: |
          node --check web/app.js
          python -m py_compile web/bridge.py
          test -f web/index.html
          test -f web/styles.css
          test -f engines/01-risk-exposure-loss-distribution/risk_model/analysis.py
          test -f engines/08-integrated-risk-dependency/engine.py
      - name: Assemble deployable interface
        run: |
          mkdir -p public
          cp -r web/. public/
          cp -r engines public/engines
          touch public/.nojekyll
          test -f public/index.html
          test -f public/bridge.py
      - name: Install browser test runtime
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Exercise the real browser interface
        run: |
          python -m http.server 8000 > /tmp/risk-lab-http.log 2>&1 &
          node web/smoke.mjs
