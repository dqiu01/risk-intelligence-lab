name: Quant model tests

on:
  push:
  pull_request:

jobs:
  model-01:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: models/01-risk-exposure-loss-distribution
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest
      - name: Run validation
        run: python validation/validate_model.py
