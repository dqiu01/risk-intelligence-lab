name: Deploy interactive Risk Intelligence Lab

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "engines/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assemble browser application
        run: |
          mkdir -p public
          cp -r web/. public/
          cp -r engines public/engines
          touch public/.nojekyll
          test -f public/index.html
          test -f public/app.js
          test -f public/bridge.py
          test -f public/engines/01-risk-exposure-loss-distribution/risk_model/analysis.py
          test -f public/engines/08-integrated-risk-dependency/engine.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
