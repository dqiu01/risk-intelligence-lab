name: Deploy interactive Risk Intelligence Lab

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /tmp/pages.json -w "%{http_code}"             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/pages")

          if [ "$status" != "200" ]; then
            echo "::error title=GitHub Pages is disabled::Open repository Settings > Pages and set Build and deployment > Source to GitHub Actions, then rerun this workflow."
            cat /tmp/pages.json || true
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Assemble browser application
        run: |
          rm -rf public
          mkdir -p public
          cp -r web/. public/
          cp -r engines public/engines
          touch public/.nojekyll

          test -f public/index.html
          test -f public/styles.css
          test -f public/app.js
          test -f public/bridge.py
          test -f public/engines/01-risk-exposure-loss-distribution/risk_model/analysis.py
          test -f public/engines/08-integrated-risk-dependency/engine.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
